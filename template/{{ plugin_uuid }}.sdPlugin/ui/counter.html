<!doctype html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>Counter Settings</title>
	<!--
		Stream Deck Property Inspector Components (sdpi-components) UI library.
		Download locally for production: https://sdpi-components.dev/releases/v4/sdpi-components.js
		Docs: https://sdpi-components.dev/
	-->
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Increment By">
		<sdpi-textfield setting="incrementBy" placeholder="1"></sdpi-textfield>
	</sdpi-item>

	<sdpi-item label="Reset at">
		<sdpi-textfield setting="resetAt" placeholder="Never"></sdpi-textfield>
	</sdpi-item>

	<details>
		<summary>About</summary>
		<p>
			This is the property inspector for the Counter action.
			It lets users configure how the counter behaves.
		</p>
		<p>
			Learn more about property inspectors at
			<a href="https://docs.elgato.com/streamdeck/sdk/guides/ui">
				docs.elgato.com
			</a>.
		</p>
	</details>
</body>
</html>
