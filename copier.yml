_min_copier_version: '9.11.3'
_subdirectory: 'template'
_jinja_extensions:
  - jinja2_time.TimeExtension
_message_before_copy: |
  This template scaffolds a Stream Deck plugin development environment.
  Learn more: https://docs.elgato.com/streamdeck/sdk/introduction/getting-started/

# ── Plugin identity ──────────────────────────────────────────────────────────

project_name:
  type: str
  help: Human-readable name of your Stream Deck plugin (shown in the Stream Deck app).

plugin_uuid:
  type: str
  help: >-
    Unique plugin identifier in reverse-DNS format (e.g., com.example.my-plugin).
    Must only contain lowercase alphanumeric characters (a-z, 0-9), hyphens (-),
    and periods (.).
  validator: >-
    {% if ' ' in plugin_uuid or plugin_uuid != plugin_uuid | lower or '.' not in plugin_uuid -%}
    Must be in reverse-DNS format (e.g., com.example.my-plugin). Use only lowercase letters, numbers, hyphens, and periods.
    {%- endif %}

author:
  type: str
  help: Plugin author name (displayed in Stream Deck and on the Marketplace).

author_email:
  type: str
  help: Plugin author email (for git and GitHub).
  validator: >-
    {% if '@' not in author_email or '.' not in author_email -%}
    Must be a valid email address containing '@' and '.'.
    {%- endif %}

description:
  type: str
  help: A short description of the plugin.

# ── Technical options ────────────────────────────────────────────────────────

node_version:
  type: str
  choices: ['20', '24']
  help: >-
    Node.js version that Stream Deck will use to run the plugin
    (specified in manifest.json Nodejs.Version).
  default: '20'

sdk_version:
  type: int
  choices: [2, 3]
  help: >-
    Stream Deck SDK version. Use 3 to enable DRM protection (requires
    Stream Deck 6.9+). Use 2 for broader compatibility.
  default: 3

# ── Repository & tooling ────────────────────────────────────────────────────

repo_name:
  type: str
  help: The name of the GitHub repository (without owner/organization).
  default: "{{ project_name | lower | replace(' ', '-') }}"

license:
  type: str
  choices: ['MIT', 'None']
  help: The software license to use.
  default: 'MIT'

gh_token:
  type: str
  help: Optional GitHub token for local development integrations.
  default: ''
  secret: true

context7_api_key:
  type: str
  help: Optional Context7 API key for local development integrations.
  default: ''
  secret: true

init_git_on_copy:
  type: bool
  help: Whether to initialize a Git repository right after scaffolding.
  default: true

# ── Post-copy tasks ─────────────────────────────────────────────────────────

_tasks:
  - command:
      - '{{ _copier_python }}'
      - -c
      - |
        import subprocess
        import sys

        check = subprocess.run(
            ["git", "rev-parse", "--is-inside-work-tree"],
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
        )
        if check.returncode == 0:
            raise SystemExit(0)

        # Try -b first (Git ≥ 2.28), fall back for older versions
        init = subprocess.run(
            ["git", "init", "-b", "main"],
            stderr=subprocess.DEVNULL,
        )
        if init.returncode != 0:
            init = subprocess.run(["git", "init"])
            if init.returncode == 0:
                subprocess.run(["git", "checkout", "-b", "main"])

        if init.returncode == 0:
            subprocess.run(["git", "config", "user.name", "{{ author }}"])
            subprocess.run(["git", "config", "user.email", "{{ author_email }}"])

        raise SystemExit(init.returncode)
    when: "{{ init_git_on_copy and _copier_operation == 'copy' }}"
